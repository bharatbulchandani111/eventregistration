spring.application.name=EventRegistrationApplication

# Your existing PostgreSQL config
spring.datasource.url=jdbc:postgresql://localhost:5432/event_registration
spring.datasource.username=myuser
spring.datasource.password=mypassword

# Your existing JPA config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Your existing JWT config
jwt.secret=your-secret-key-change-in-production
jwt.expiration=86400000

# Server config
server.port=8080

# MyBatis config
mybatis.mapper-locations=classpath*:mapper/**/*.xml
mybatis.type-aliases-package=com.example.eventregistration.entity
mybatis.configuration.map-underscore-to-camel-case=true

# Redis config
spring.cache.type=redis
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.timeout=60000
spring.cache.redis.time-to-live=600000

# Jackson config
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.adjust-dates-to-context-time-zone=true
spring.jackson.time-zone=Asia/Kolkata


# Debug logging
debug=true
logging.level.org.springframework.security=DEBUG
logging.level.com.example.springproject.service.ElasticLoggingService=DEBUG

# Add Elasticsearch configuration
spring.elasticsearch.uris=http://localhost:9200
spring.elasticsearch.connection-timeout=5s
spring.elasticsearch.socket-timeout=30s