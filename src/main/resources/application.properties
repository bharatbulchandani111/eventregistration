spring.application.name=EventRegistrationApplication

# Database Configuration - REMOVE THE PARENTHESES AND DESCRIPTIVE TEXT!
spring.datasource.url=jdbc:postgresql://localhost:5432/event_registration
spring.datasource.username=myuser
spring.datasource.password=mypassword

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Remove or comment out this line to avoid the warning:
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=your-secret-key-change-in-production
jwt.expiration=86400000

# Server Configuration
server.port=8080
# Temporarily disable security
#spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# MyBatis Configuration
mybatis.mapper-locations=classpath*:mapper/**/*.xml
mybatis.type-aliases-package=com.example.eventregistration.entity
mybatis.configuration.map-underscore-to-camel-case=true

debug=true
logging.level.org.springframework.security=DEBUG